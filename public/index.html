<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To do">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>To do</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>✅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f5f6f8;
  --card: #ffffff;
  --ink: #1c2230;
  --muted: #6b7385;
  --line: #dfe3ea;
  --accent: #0f766e;
  --accent-ink: #ffffff;
  --danger: #b42318;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --paper: #14171f;
    --card: #1b1f2a;
    --ink: #e8ebf1;
    --muted: #8a93a6;
    --line: #2a3040;
    --accent: #5ed0c4;
    --accent-ink: #0b1a18;
    --danger: #f97066;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
  font-size: 16px;
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
}
main { max-width: 640px; margin: 0 auto; padding: 40px 0 64px; }
h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; display: flex; gap: 16px; flex-wrap: wrap; }
h2 {
  font-size: 0.9rem; font-weight: 600; color: var(--muted);
  margin: 32px 0 4px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}

button, input { font: inherit; color: var(--ink); }
button {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  white-space: nowrap;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
button:hover { border-color: var(--accent); }
input[type="text"], input[type="number"], .edit {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 10px;
  padding: 10px 12px;
  min-width: 0;
  font-size: 16px; /* avoids iOS zoom */
}
input[type="text"] { flex: 1; }
input[type="number"] { width: 64px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.add { display: flex; gap: 8px; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 16px 0 8px; }
#status { color: var(--muted); font-size: 0.9rem; }

.list { list-style: none; margin: 0; padding: 0; }
.item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 4px; border-bottom: 1px solid var(--line);
}
.item input[type="checkbox"] {
  width: 20px; height: 20px; margin: 0; flex: none;
  accent-color: var(--accent); cursor: pointer;
}
.text {
  flex: 1; min-width: 0; overflow-wrap: anywhere;
  padding: 2px 0; cursor: text; border-radius: 4px;
}
.text:focus-visible { outline-offset: 4px; }
.item.done .text { color: var(--muted); text-decoration: line-through; }
.item.picked {
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  border-radius: 10px; border-bottom-color: transparent;
  padding-left: 10px; padding-right: 10px;
}
.edit { flex: 1; }
.del {
  border: none; background: none; color: var(--muted);
  padding: 4px 8px; font-size: 1.25rem; line-height: 1;
}
.del:hover { color: var(--danger); border: none; }
.empty { color: var(--muted); padding: 20px 4px; border-bottom: 1px solid var(--line); }
.item.priority .text { font-weight: 600; }
.star {
  border: none; background: none; color: var(--muted);
  padding: 2px 4px; font-size: 1.2rem; line-height: 1; flex: none;
}
.star[aria-pressed="true"] { color: #d99a00; }
.handle {
  flex: none; padding: 4px 2px; font-size: 1.1rem; line-height: 1;
  color: var(--muted); cursor: grab;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.item.dragging {
  position: relative; z-index: 2; background: var(--card);
  border-radius: 10px; border-bottom-color: transparent;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
}
.item.drop-above { box-shadow: inset 0 2px 0 var(--accent); }
.item.drop-below { box-shadow: inset 0 -2px 0 var(--accent); }
</style>
</head>
<body>
<main>
  <h1>To do</h1>
  <div class="sub"><span id="count"></span><span id="sync"></span></div>

  <form id="add-form" class="add" autocomplete="off">
    <input id="new" type="text" placeholder="Add a to-do" aria-label="New to-do" maxlength="500">
    <button class="primary" type="submit">Add</button>
  </form>

  <div class="toolbar">
    <input id="pick-count" type="number" min="1" value="1" aria-label="How many to pick">
    <button id="pick" type="button">Pick random</button>
    <button id="clear-pick" type="button" hidden>Clear pick</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>

  <ul id="list" class="list" aria-label="Open to-dos"></ul>

  <h2 id="done-head" hidden><span id="done-title"></span></h2>
  <ul id="done" class="list" aria-label="Done to-dos"></ul>
</main>

<script>
const API = "/api/todos";
const KEY = "todo-app-v1";              // this device's cached copy
const PENDING_KEY = "todo-app-pending"; // set while a change has not reached the server
const PICK_KEY = "todo-app-pick-count"; // the "Pick random" number, remembered on this device
const $ = (s) => document.querySelector(s);

let tasks = [];
let picked = new Set();
let editingId = null;
let writeChain = Promise.resolve();
let loaded = false; // true once the server copy has been checked

function loadLocal() {
  try {
    const v = JSON.parse(localStorage.getItem(KEY));
    return Array.isArray(v) ? v : [];
  } catch (e) {
    return [];
  }
}
function setSync(text) {
  $("#sync").textContent = text;
}

async function remoteLoad() {
  const res = await fetch(API);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json(); // { tasks, pickCount }
}
function currentPickCount() {
  const n = parseInt($("#pick-count").value, 10);
  return Number.isInteger(n) && n >= 1 ? Math.min(n, 999) : 1;
}

async function remoteSave(json) {
  const res = await fetch(API, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: `{"tasks":${json},"pickCount":${currentPickCount()}}`,
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(tasks));
    localStorage.setItem(PENDING_KEY, "1");
  } catch (e) {
    console.warn("Could not cache to-dos:", e);
  }
  setSync("Saving…");
  // One save at a time; each sends the latest list.
  writeChain = writeChain.then(async () => {
    const snapshot = JSON.stringify(tasks);
    await remoteSave(snapshot);
    if (JSON.stringify(tasks) === snapshot) {
      try { localStorage.removeItem(PENDING_KEY); } catch (e) {}
    }
    setSync("Saved");
  }).catch((e) => {
    console.warn(e);
    setSync("Not saved to server yet. It will retry on your next visit.");
  });
}

async function init() {
  tasks = loadLocal();
  render();
  try {
    const remote = await remoteLoad();
    let pending = false;
    try { pending = !!localStorage.getItem(PENDING_KEY); } catch (e) {}
    if (pending || (!remote.tasks.length && tasks.length)) {
      // This device has changes the server has not seen yet: send them up.
      await remoteSave(JSON.stringify(tasks));
      try { localStorage.removeItem(PENDING_KEY); } catch (e) {}
    } else {
      tasks = remote.tasks;
      try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
    }
    if (typeof remote.pickCount === "number") {
      $("#pick-count").value = remote.pickCount;
      try { localStorage.setItem(PICK_KEY, String(remote.pickCount)); } catch (e) {}
    }
    setSync("Saved");
  } catch (e) {
    setSync("Server unreachable. Showing this device's copy.");
  }
  loaded = true;
  render();
}

function add(text) {
  text = text.trim();
  if (!text) return;
  tasks.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), text, done: false, doneAt: null, priority: false });
  save();
  render();
}
function find(id) {
  return tasks.find((t) => t.id === id);
}
function toggle(id) {
  const t = find(id);
  if (!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;
  if (t.done) picked.delete(id);
  save();
  render();
}
function rename(id, text) {
  const t = find(id);
  text = text.trim();
  if (t && text) {
    t.text = text;
    save();
  }
  render();
}
function remove(id) {
  tasks = tasks.filter((t) => t.id !== id);
  picked.delete(id);
  save();
  render();
}

function pickRandom() {
  const n = Math.max(1, parseInt($("#pick-count").value, 10) || 1);
  const arr = tasks.filter((t) => !t.done);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  picked = new Set(arr.slice(0, n).map((t) => t.id));
  render();
  const k = picked.size;
  $("#status").textContent = k === 0
    ? "No open to-dos to pick from."
    : k < n
      ? `Only ${k} open to-do${k === 1 ? "" : "s"} to pick from.`
      : `Picked ${k} at random.`;
}
function clearPick() {
  picked.clear();
  $("#status").textContent = "";
  render();
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v === true) node.setAttribute(k, "");
    else if (v !== false && v != null) node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

// Open items: priority first, then manual order. The saved list keeps this order.
function visiblePending() {
  return tasks
    .filter((t) => !t.done)
    .sort((a, b) => (b.priority ? 1 : 0) - (a.priority ? 1 : 0));
}

// Write the open items back into the saved list, in the given order.
// Done items keep their places.
function writePendingOrder(list) {
  const slots = [];
  tasks.forEach((t, i) => { if (!t.done) slots.push(i); });
  slots.forEach((slot, k) => { tasks[slot] = list[k]; });
}

// Drag and drop. Works with mouse and touch. The row follows the finger, a line
// shows where it will land, and the new order is saved on release. Drags stay
// inside the same priority group.
let drag = null;

function handle(t) {
  return el("span", {
    class: "handle", title: "Drag to reorder", "aria-label": "Drag to reorder",
    onpointerdown: startDrag,
    onpointermove: moveDrag,
    onpointerup: (e) => endDrag(e, true),
    onpointercancel: (e) => endDrag(e, false),
  }, "⠿");
}

function startDrag(e) {
  const handleEl = e.currentTarget;
  const li = handleEl.closest("li");
  const id = li.dataset.id;
  const pending = visiblePending();
  const fromIndex = pending.findIndex((x) => x.id === id);
  if (fromIndex < 0) return;
  const me = pending[fromIndex];

  let lo = fromIndex;
  let hi = fromIndex;
  while (lo > 0 && !!pending[lo - 1].priority === !!me.priority) lo--;
  while (hi < pending.length - 1 && !!pending[hi + 1].priority === !!me.priority) hi++;

  const groupIds = new Set(pending.slice(lo, hi + 1).map((x) => x.id));
  const others = [...$("#list").querySelectorAll("li[data-id]")]
    .filter((r) => r.dataset.id !== id && groupIds.has(r.dataset.id));

  const rect = li.getBoundingClientRect();
  drag = {
    id, li, pointerId: e.pointerId, startY: e.clientY,
    centerY: rect.top + rect.height / 2, lo, fromIndex, others, k: null,
  };
  handleEl.setPointerCapture(e.pointerId);
  li.classList.add("dragging");
  e.preventDefault();
}

function moveDrag(e) {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const dy = e.clientY - drag.startY;
  drag.li.style.transform = `translateY(${dy}px)`;

  const y = drag.centerY + dy;
  let k = 0; // how many other rows in the group sit above the dragged row
  drag.others.forEach((r) => {
    const b = r.getBoundingClientRect();
    if (b.top + b.height / 2 < y) k++;
  });
  drag.k = k;

  drag.others.forEach((r) => r.classList.remove("drop-above", "drop-below"));
  if (drag.others.length) {
    if (k < drag.others.length) drag.others[k].classList.add("drop-above");
    else drag.others[drag.others.length - 1].classList.add("drop-below");
  }
}

function endDrag(e, apply) {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const d = drag;
  drag = null;
  d.li.style.transform = "";
  d.li.classList.remove("dragging");
  d.others.forEach((r) => r.classList.remove("drop-above", "drop-below"));
  if (!apply || d.k === null) return;

  const at = d.lo + d.k;
  if (at === d.fromIndex) return; // dropped where it started

  const list = visiblePending();
  const item = list.find((x) => x.id === d.id);
  const rest = list.filter((x) => x.id !== d.id);
  rest.splice(at, 0, item);
  writePendingOrder(rest);
  save();
  render();
}

function togglePriority(id) {
  const t = find(id);
  if (!t) return;
  t.priority = !t.priority;
  save();
  render();
}

function row(t) {
  const classes = ["item"];
  if (t.done) classes.push("done");
  if (!t.done && t.priority) classes.push("priority");
  if (picked.has(t.id)) classes.push("picked");

  const cb = el("input", { type: "checkbox", "aria-label": "Mark as done", onchange: () => toggle(t.id) });
  cb.checked = t.done;
  const parts = [];
  if (!t.done) parts.push(handle(t));
  parts.push(cb);

  if (!t.done) {
    parts.push(el("button", {
      class: "star", type: "button",
      "aria-pressed": t.priority ? "true" : "false",
      "aria-label": t.priority ? "Remove priority" : "Set as priority",
      title: t.priority ? "Remove priority" : "Set as priority",
      onclick: () => togglePriority(t.id),
    }, t.priority ? "★" : "☆"));
  }

  if (editingId === t.id) {
    let cancel = false;
    const input = el("input", {
      class: "edit", type: "text", value: t.text, maxlength: 500, "aria-label": "Edit to-do",
      onkeydown: (e) => {
        if (e.key === "Enter") e.target.blur();
        if (e.key === "Escape") { cancel = true; e.target.blur(); }
      },
      onblur: (e) => {
        if (editingId !== t.id) return;
        editingId = null;
        if (cancel) render();
        else rename(t.id, e.target.value);
      },
    });
    setTimeout(() => { input.focus(); input.select(); }, 0);
    parts.push(input);
  } else {
    parts.push(el("span", {
      class: "text", tabindex: 0, title: "Click to edit",
      onclick: () => { editingId = t.id; render(); },
      onkeydown: (e) => { if (e.key === "Enter") { editingId = t.id; render(); } },
    }, t.text));
  }

  parts.push(el("button", { class: "del", type: "button", "aria-label": "Delete to-do", onclick: () => remove(t.id) }, "×"));
  return el("li", { class: classes.join(" "), "data-id": t.id }, ...parts);
}

function render() {
  const pending = visiblePending();
  const done = tasks.filter((t) => t.done).sort((a, b) => b.doneAt - a.doneAt);

  const list = $("#list");
  list.replaceChildren();
  if (!pending.length) {
    list.append(el("li", { class: "empty" },
      tasks.length ? "All done. Add the next one above." : "Nothing here yet. Type a to-do above and press Enter."));
  }
  pending.forEach((t) => list.append(row(t)));

  const doneList = $("#done");
  doneList.replaceChildren();
  $("#done-head").hidden = done.length === 0;
  $("#done-title").textContent = `Done (${done.length})`;
  done.forEach((t) => doneList.append(row(t)));

  $("#count").textContent = `${pending.length} open, ${done.length} done`;
  $("#clear-pick").hidden = picked.size === 0;
}

$("#add-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = $("#new");
  add(input.value);
  input.value = "";
  input.focus();
});
$("#pick").addEventListener("click", pickRandom);
$("#clear-pick").addEventListener("click", clearPick);

try {
  const saved = localStorage.getItem(PICK_KEY);
  if (saved) $("#pick-count").value = saved;
} catch (e) {}
$("#pick-count").addEventListener("input", (e) => {
  try { localStorage.setItem(PICK_KEY, e.target.value); } catch (err) {}
});
$("#pick-count").addEventListener("change", () => {
  if (loaded) save();
});

init();
$("#new").focus();
</script>
</body>
</html>
