name = "todo-cloudflare"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Serve the page from public/. Requests to /api/* go to the Worker first.
[assets]
directory = "./public"
run_worker_first = ["/api/*"]

# Replace YOUR_KV_NAMESPACE_ID with the ID shown on the "todos" KV namespace page
# in the Cloudflare dashboard (Storage & Databases → KV → todos).
[[kv_namespaces]]
binding = "TODOS"
id = "YOUR_KV_NAMESPACE_ID"

